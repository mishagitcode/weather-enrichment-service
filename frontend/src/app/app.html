<p-toast />

<div class="layout">
  <header class="app-header">
    <i class="pi pi-cloud header-icon"></i>
    <h1>Weather Enrichment Service</h1>
  </header>

  <main class="app-content">
    <p-card header="Add City" styleClass="add-city-card">
      <div class="add-city-form">
        <input
          pInputText
          [(ngModel)]="cityName"
          placeholder="Enter city name"
          (keyup.enter)="addCity()"
          class="city-input"
        />
        <p-button
          label="Add City"
          icon="pi pi-plus"
          [loading]="adding()"
          [disabled]="!cityName().trim()"
          (onClick)="addCity()"
        />
      </div>
    </p-card>

    <p-card header="Cities & Weather" styleClass="cities-card">
      <app-city-list />
    </p-card>
  </main>
</div>
